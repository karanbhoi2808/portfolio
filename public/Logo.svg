<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FFBBE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1C1C" />
      <stop offset="100%" stop-color="#0D0E0F" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" stroke="url(#kb-grad)" stroke-width="16" />
  <!-- Text KB -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="url(#kb-grad)" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="220" letter-spacing="-6">KB</text>
</svg>
